<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pulsekid</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo">pulse<i>kid</i></div>
  <div class="grp"><button id="rw">⏮</button><button id="pp">▶</button><button id="rc">●</button></div>
  <div id="time">00:00.0</div>
  <div class="grp">entrada <select id="dev"><option value="">padrão</option></select><div class="meter"><div id="mm"></div></div></div>
  <div class="grp">latência <input id="lat" type="number" value="0" step="5">ms</div>
  <div class="grp"><button id="zo">−</button><button id="zi">+</button></div>
  <div class="grp" title="altura das trilhas"><button id="hvo">↕−</button><button id="hvi">↕+</button></div>
  <div class="sp"></div>
  <div class="grp">saída <div class="meter"><div id="om"></div></div></div>
  <button id="imp">importar</button><button id="add">+ trilha</button><button id="exp">exportar wav</button>
  <input type="file" id="file" accept="audio/*" hidden>
</header>
<div class="bar">
  <div class="grp">bpm <input id="bpm" type="number" min="30" max="300" value="120"></div>
  <button id="metro" title="metrônomo (M)">metrônomo</button>
  <button id="cnt" title="contagem de 1 compasso antes de gravar">contagem</button>
  <button id="loop" title="loop (L) · arraste na régua para definir a região">loop</button>
  <button id="snap" class="on" title="alinhar à grade de tempo">snap</button>
  <span class="vr"></span>
  <button id="undo" title="desfazer (Ctrl+Z)">↶</button><button id="redo" title="refazer (Ctrl+Shift+Z)">↷</button>
  <button id="split" title="cortar no cursor (S)">cortar</button>
  <button id="dup" title="duplicar clipe (Ctrl+D)">duplicar</button>
  <button id="del" title="apagar clipe (Delete)">apagar</button>
  <button id="tune" title="afinar o clipe selecionado (correção de pitch)">afinar</button>
  <span class="vr"></span>
  <button id="tn" title="medidor de afinação ao vivo (usa o microfone)">medidor</button>
  <div id="tnw"><b id="tnn">–</b><div class="tnbar"><i class="mid"></i><i id="tnd"></i></div><span id="tnc"></span></div>
  <div class="sp"></div>
  <span id="sv" style="color:var(--mut)"></span>
  <button id="new">novo</button><button id="save" title="Ctrl+S">salvar</button>
</div>
<div id="wrap">
  <div id="scroll"><div id="inner"><div id="tracks"></div><div id="ph"></div></div></div>
  <aside><h2 id="insT">plugins</h2><div id="fxs"></div>
    <div class="grp"><select id="plsel"></select><button id="pladd">+ plugin</button></div>
    <h2 style="margin-top:8px">terceiros · WAM</h2>
    <select id="wamsel" style="width:100%"><option value="">catálogo da comunidade (experimental)</option></select>
    <input id="wamurl" class="nm" placeholder="ou cole a URL do index.js do plugin" style="width:100%">
    <button id="wamadd">carregar plugin</button>
    <div style="color:var(--mut);font-size:11px">Arquivos .vst/.vst3/.dll do FL Studio não rodam no navegador. WAM é o padrão equivalente para a web.</div>
  </aside>
</div>
<div id="modal"><div class="mbox"><div class="mt"><b id="mtitle"></b><button id="mclose">fechar</button></div><div id="mbody"></div></div></div>
<div id="toast"></div>
<script src="js/core.js"></script>
<script src="js/plugins.js"></script>
<script src="js/audio.js"></script>
<script src="js/clips.js"></script>
<script src="js/ui.js"></script>
<script src="js/wam.js"></script>
<script src="js/io.js"></script>
<script src="js/project.js"></script>
<script src="js/tuner.js"></script>
<script src="js/main.js"></script>
</body>
</html>
